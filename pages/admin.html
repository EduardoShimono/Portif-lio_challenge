
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel administrativo | Eduardo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                Eduardo.dev
            </a>

            <a href="../index.html" class="btn btn-outline-primary">
                Voltar ao portfólio
            </a>

        </div>
    </nav>


    <main class="container py-5 admin-page">

        <h1 class="mb-3">Painel administrativo</h1>

        <p>
            Gerenciamento das mensagens recebidas pelo formulário de contato.
        </p>

        <div class="card mb-4">
            <div class="card-body">

                <h3>Total de mensagens</h3>

                <p class="admin-total" id="totalMensagens">0</p>

                <button id="exportarJson" class="btn btn-primary">
                    Exportar mensagens em JSON
                </button>

            </div>
        </div>


        <div class="card">
            <div class="card-body">

                <h3 class="mb-4">Mensagens recebidas</h3>

                <div class="table-responsive">

                    <table class="table table-dark table-hover align-middle">

                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Mensagem</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="listaMensagens">
                            <tr>
                                <td colspan="5">Carregando mensagens...</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </main>


    <script src="../js/script.js"></script>

</body>
</html>
